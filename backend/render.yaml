services:
  - type: web
    name: news-drift-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_EXPIRE_HOURS
        value: "24"
      - key: ALLOWED_ORIGINS
        sync: false
